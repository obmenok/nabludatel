<h2>Поиск по архиву</h2>
<p class="note">Ищет по номерам газеты, ленте новостей и гостевой книге 1998&ndash;2005 годов. Несколько слов в запросе означают &laquo;и&raquo;.</p>
<div id="search"></div>
<script src="pagefind/pagefind-ui.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  // сайт лежит в подпапке (/nabludatel/), поэтому адреса результатов строим от папки этой страницы
  var base = location.pathname.replace(/[^/]*$/, '');
  var ui = new PagefindUI({ element: '#search', baseUrl: base, showImages: false, showSubResults: false, resetStyles: false, autofocus: true });
  var q = new URLSearchParams(location.search).get('q');
  if (q) { ui.triggerSearch(q); }
});
</script>
